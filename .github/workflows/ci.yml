# Gradus is a Faber-only library, checked against the newest faber build of radix main. It runs on the
# studios' gradus CI lanes (operator 2026-11-27: gradus works like radix from a runner perspective): each lane
# is a clone of this repository bound to one self-hosted runner (trees/faber-gradus-NN on a studio), so a job
# takes no fresh checkout; .github/lane/prepare cleans the lane's clone and puts it at the commit under test.
# faber is the studio's own Build faber `current` build (built from radix main about every 30 min; the same
# commits as the `faber-edge` prerelease), or a faberlang/releases tag given to a manual run.
#
# gradus is public: a pull request from a fork never runs here (the job's `if`, and the repository requires
# approval for every outside contributor). macOS only for now: no Linux coverage until hub hosts lanes.
#
# The nightly schedule is what catches a radix change that breaks gradus (11-24: radix#1753's math-word
# rule broke gradus within the hour and nothing noticed: faberlang/gradus#54).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 8 * * *"      # 03:30 EST, after radix's nightly runs
  workflow_dispatch:
    inputs:
      faber:
        description: "faber to test with: local (the studio's Build faber build), or a faberlang/releases tag (faber-edge, a dated nightly)"
        required: false
        default: local

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: [self-hosted, faber-gradus-ci]
    # Never a fork's pull request on a self-hosted lane.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    env:
      TRIPLE: aarch64-apple-darwin
      FABER_TAG: ${{ inputs.faber || 'local' }}
      WANT: ${{ github.event.pull_request.head.sha || github.sha }}
    # Each check runs even when an earlier one failed, so one run reports every red check.
    steps:
      # The lane's clone is $LANE_REPO (named gradus/, inside the lane directory), so the lane directory is a
      # library home holding gradus (faber.toml's `library_home = ".."` and check-compile's LIBRARY_HOME).
      # The prepare script is read from the commit under test, so a change to it is tested by its own PR.
      - name: Prepare the lane (${{ env.WANT }})
        run: |
          set -euo pipefail
          : "${LANE_REPO:?this runner is not a lane}"
          git -C "$LANE_REPO" fetch -q origin "$WANT" 2>/dev/null || git -C "$LANE_REPO" fetch -q origin
          git -C "$LANE_REPO" show "$WANT:.github/lane/prepare" > "$RUNNER_TEMP/prepare"
          repo=$(bash "$RUNNER_TEMP/prepare" "$WANT")
          { echo "REPO_DIR=$repo"; echo "LIBRARY_HOME=$LANE_DIR"; } >> "$GITHUB_ENV"
          echo "lane $LANE_NAME at ${WANT:0:10}" >> "$GITHUB_STEP_SUMMARY"

      - name: Take faber (${{ env.FABER_TAG }})
        id: faber
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$FABER_TAG" = local ]; then
            # Pinned for the whole job: the relay may move `current` to a newer build meanwhile.
            d=$(cd /Volumes/Lanes/vivi/cache/faber-builds/lean/current && pwd -P)
            [ -f "$d/ok" ] || { echo "::error::$d is not a complete build"; exit 1; }
            echo "FABER_BIN=$d/faber" >> "$GITHUB_ENV"
            commit=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["sha"])' "$d/meta.json")
            echo "faber: the studio's Build faber build, radix ${commit:0:10}: $("$d/faber" --version 2>&1 | head -n 1)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            d="$RUNNER_TEMP/faber"; rm -rf "$d"; mkdir -p "$d"
            gh release download "$FABER_TAG" --repo faberlang/releases --dir "$d" \
              --pattern "faber-v*-$TRIPLE.tar.gz" --pattern "faber-v*-$TRIPLE.tar.gz.sha256" \
              --pattern "faber-v*-$TRIPLE.identity.json"
            (cd "$d" && shasum -a 256 -c ./*.tar.gz.sha256)
            tar xzf "$d"/*.tar.gz -C "$d"
            echo "FABER_BIN=$d/bin/faber" >> "$GITHUB_ENV"
            commit=$(python3 -c 'import glob, json, sys; print(json.load(open(glob.glob(sys.argv[1] + "/*.identity.json")[0]))["sourceCommit"])' "$d")
            echo "faber from $FABER_TAG, radix ${commit:0:10}: $("$d/bin/faber" --version 2>&1 | head -n 1)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Source rules (check-source)
        working-directory: ${{ env.REPO_DIR }}
        run: ./scripta/check-source

      - name: Compile the library and its exempla (check-compile)
        if: ${{ !cancelled() && steps.faber.outcome == 'success' }}
        working-directory: ${{ env.REPO_DIR }}
        run: ./scripta/check-compile

      - name: Package tests (faber test)
        if: ${{ !cancelled() && steps.faber.outcome == 'success' }}
        working-directory: ${{ env.REPO_DIR }}
        # Ratchet on pre-existing compiler-blocked tests (111 under faber-edge on
        # Linux, 11-26; recount on the studios' macOS build: MIR tensor-extent validation on generic kernels/tests,
        # 3 loss.fab multi-op mse, 2 data.fab Cranelift verifier). Fails on
        # analysis errors, any failed > 0, or any new blocked > MAX_BLOCKED.
        env:
          MAX_BLOCKED: "111"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/faber-test.log"
          set +e
          "$FABER_BIN" test . 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          python3 - "$log" "$MAX_BLOCKED" "$rc" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          max_blocked = int(sys.argv[2])
          rc = int(sys.argv[3])
          matches = re.findall(
              r"^test result:\s+\S+\.\s+(\d+) passed;\s+(\d+) failed;\s+(\d+) blocked;\s+(\d+) skipped",
              text,
              re.MULTILINE,
          )
          if not matches:
              print(f"ERROR: no 'test result:' summary found (faber exit {rc})", file=sys.stderr)
              sys.exit(rc or 1)
          passed, failed, blocked, skipped = map(int, matches[-1])
          print(f"Summary: {passed} passed, {failed} failed, {blocked} blocked (max {max_blocked}), {skipped} skipped")
          if failed > 0:
              sys.exit(1)
          if blocked > max_blocked:
              print(f"ERROR: blocked count {blocked} exceeds ratchet {max_blocked}", file=sys.stderr)
              sys.exit(1)
          if blocked < max_blocked:
              print(f"NOTE: blocked count dropped to {blocked} (< {max_blocked}); ratchet MAX_BLOCKED down!")
          PY

      - name: Speculative-decode corpus rows (check-corpus)
        if: ${{ !cancelled() && steps.faber.outcome == 'success' }}
        working-directory: ${{ env.REPO_DIR }}
        run: python3 scripta/check-corpus
