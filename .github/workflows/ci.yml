# Gradus is a Faber-only library, checked against the newest faber build of radix main: the rolling
# `faber-edge` prerelease in faberlang/releases (replaced after every Build faber run, about hourly on
# Linux). The nightly schedule is what catches a radix change that breaks gradus (11-24: radix#1753's
# math-word rule broke gradus within the hour and nothing noticed: faberlang/gradus#54).
#
# GitHub-hosted runners only: gradus is public, so a fork's pull request must never run on our
# self-hosted machines.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 8 * * *"      # 03:30 EST, after radix's nightly runs
  workflow_dispatch:
    inputs:
      faber:
        description: "faberlang/releases tag to test with (faber-edge, or a dated nightly)"
        required: false
        default: faber-edge

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIPLE: x86_64-unknown-linux-gnu
      FABER_TAG: ${{ inputs.faber || 'faber-edge' }}
    # Each check runs even when an earlier one failed, so one run reports every red check.
    steps:
      # Checked out under the workspace as `gradus/`, so the workspace is a library home holding
      # gradus (faber.toml's `library_home = ".."` and check-compile's LIBRARY_HOME both see it).
      - uses: actions/checkout@v4
        with:
          path: gradus

      - name: Take faber (${{ env.FABER_TAG }})
        id: faber
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/faber"; mkdir -p "$d"
          gh release download "$FABER_TAG" --repo faberlang/releases --dir "$d" \
            --pattern "faber-v*-$TRIPLE.tar.gz" --pattern "faber-v*-$TRIPLE.tar.gz.sha256" \
            --pattern "faber-v*-$TRIPLE.identity.json"
          (cd "$d" && sha256sum -c ./*.tar.gz.sha256)
          tar xzf "$d"/*.tar.gz -C "$d"
          echo "FABER_BIN=$d/bin/faber" >> "$GITHUB_ENV"
          commit=$(python3 -c 'import glob, json, sys; print(json.load(open(glob.glob(sys.argv[1] + "/*.identity.json")[0]))["sourceCommit"])' "$d")
          echo "faber from $FABER_TAG, radix ${commit:0:10}: $("$d/bin/faber" --version 2>&1 | head -n 1)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Source rules (check-source)
        working-directory: gradus
        run: ./scripta/check-source

      - name: Compile the library and its exempla (check-compile)
        if: ${{ !cancelled() && steps.faber.outcome == 'success' }}
        working-directory: gradus
        env:
          LIBRARY_HOME: ${{ github.workspace }}
        run: ./scripta/check-compile

      - name: Package tests (faber test)
        if: ${{ !cancelled() && steps.faber.outcome == 'success' }}
        working-directory: gradus
        # Ratchet on pre-existing compiler-blocked tests (currently 100 under
        # faber-edge: MIR tensor-extent validation on generic kernels/tests,
        # 3 loss.fab multi-op mse, 2 data.fab Cranelift verifier). Fails on
        # analysis errors, any failed > 0, or any new blocked > MAX_BLOCKED.
        env:
          MAX_BLOCKED: "100"
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/faber-test.log"
          set +e
          "$FABER_BIN" test . 2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          python3 - "$log" "$MAX_BLOCKED" "$rc" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          max_blocked = int(sys.argv[2])
          rc = int(sys.argv[3])
          matches = re.findall(
              r"^test result:\s+\S+\.\s+(\d+) passed;\s+(\d+) failed;\s+(\d+) blocked;\s+(\d+) skipped",
              text,
              re.MULTILINE,
          )
          if not matches:
              print(f"ERROR: no 'test result:' summary found (faber exit {rc})", file=sys.stderr)
              sys.exit(rc or 1)
          passed, failed, blocked, skipped = map(int, matches[-1])
          print(f"Summary: {passed} passed, {failed} failed, {blocked} blocked (max {max_blocked}), {skipped} skipped")
          if failed > 0:
              sys.exit(1)
          if blocked > max_blocked:
              print(f"ERROR: blocked count {blocked} exceeds ratchet {max_blocked}", file=sys.stderr)
              sys.exit(1)
          if blocked < max_blocked:
              print(f"NOTE: blocked count dropped to {blocked} (< {max_blocked}); ratchet MAX_BLOCKED down!")
          PY

      - name: Speculative-decode corpus rows (check-corpus)
        if: ${{ !cancelled() && steps.faber.outcome == 'success' }}
        working-directory: gradus
        run: python3 scripta/check-corpus
