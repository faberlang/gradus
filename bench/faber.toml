# gradus bench case package — the GB-U2 bench-harness case inventory.
# Runs through the MIR runner: faber run <this-dir> -- <label> <K>
# (labels + iteration counts live in cases.toml; the check-library label
# is a `faber check` route recorded there, not a runnable case here).

[package]
name = "bench"
version = "0.1.0"
edition = "2026"

[paths]
source = "src"
entry = "main.fab"

[build]
target = "fmir"
kind = "bin"

[locale]
locale = "en"
