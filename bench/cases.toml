# gradus bench case manifest — the 7-label inventory (goal
# docs/factory/bench-harness/goal.md §Case inventory; delivery row GB-U2).
#
# Consumed by the harness run loop (GB-U3). Labels are unique. Every
# entry is class fixed-oracle: a fixed computation run to natural exit
# printing one value-check line (check.library.compile's check line is
# the checker's own ok line). Metric law (goal §Perf-taxonomy):
# t/s = unit-count / min(completion, cap_s) per sample, median across
# samples — cap_s is a safety circuit breaker, never a metric and never
# pass/fail; a capped sample records its valid t/s plus capped=true.
#
# Run route: faber run <bench-dir> -- <label> <iterations>
# Check route: faber check <gradus-library-dir>
# Iteration counts are calibrated on the pinned-radix release binary so
# the K-loop dominates process startup (setup + interpreter dispatch).
#
# Substitution record (goal substitution rule — device-admission-only
# named surfaces run on the nearest public carrier surface at the same
# tell-tale shape; nothing was dropped):
#   * gemv.f32.320x960 — the GEA1 `@ kernel` gemv_f32_f32acc entry
#     [320,960] cannot execute on the MIR runner; substituted with the
#     public carrier matmul row [1,960] x [960,320] (weights built in
#     transposed layout at construction; identical 307,200 MACs and
#     tell-tale 960 width).
#   * decode.attention.row76.d960 — the GEA3-U3a per-head device entries
#     (d=64, H=15, T=1, L_max=76) are @ kernel bodies; substituted with
#     attention.scaled_dot_product_causal_rope_cached as one full-width
#     row: q/k/v [1,960] against a 75-row dim-960 KV cache (76 attended
#     keys, RoPE dim 960, cache write included). MAC count equals the
#     per-head GEA chain; the kernel chain stops at context_gemm, so no
#     output projection is included.
#   * prefill.attention.rows36.l76.d960 — same substitution for the
#     GEA3-U3b family: q/k/v [36,960] into an empty cache whose
#     admission bound covers the frozen L_max=76 window, causal, at
#     positions 0..35.
#   * carrier labels and block.matmul need no substitution (public
#     carrier surface at the exact tell-tale shape).

[[case]]
label = "carrier.elementwise.add.f32.320x960"
route = "run"
entry = "case_carrier_add"
class = "fixed-oracle"
work_unit = "elementwise f32 add over a [320,960] carrier block"
units_per_iteration = 307200
throughput = "elements/s"
iterations = 8   # measured release sample wall ~28 s (this machine, pin 9dc17410d)
cap_s = 60
tier = "cpu-reference"
surface = "gradus:math add_carrier on tensor.NumericBlock (GEA1 tell-tale [320,960])"

