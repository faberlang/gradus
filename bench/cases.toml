units_per_iteration = 307200
throughput = "elements/s"
iterations = 16   # measured release sample wall ~24 s
cap_s = 60
tier = "cpu-reference"
surface = "gradus:math sum axis 1 on tensor.NumericBlock (GEA1 tell-tale [320,960])"

