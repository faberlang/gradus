# Gradus as a cista source package.
#
# Install maps `interfaces = "src"` into the store as
# `$CISTAE_HOME/gradus/<version>/interfaces/`. Version is independent of the
# faber crate. Apps declare gradus in faber.toml when they need autograd / ML
# types.

[source]
package = "gradus"
version = "0.1.0"
kind = "source"
interfaces = "src"

[target]
language = "rust"
mode = "compile"
binding_policy = "generated"
crate = "gradus"
