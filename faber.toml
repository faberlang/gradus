[package]
name = "inferentia"
version = "0.1.0"
edition = "2026"

[paths]
source = "src"
entry = "main.fab"

# The image target: `faber check` and `faber build` accept the run-time tensor
# shapes the decode launches use (the Rust target refuses them), and `faber run`
# executes the source on the device named by `--device`. gradus resolves from the
# library home (`--library-home`), not from a lock.
[build]
target = "fmir"
kind = "bin"

[locale]
locale = "en"
