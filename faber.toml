[package]
name = "inferentia"
version = "0.1.0"
edition = "2026"

[paths]
source = "src"
entry = "main.fab"

[build]
kind = "bin"

# Inference never runs on the MIR interpreter (operator rule): a run whose host
# half or kernels would fall back refuses instead (exit 69, ENGINE001/ENGINE002).
[run]
strict-engine = true

[locale]
locale = "en"
