[package]
name = "gradus"
version = "0.1.0"
edition = "2026"

[library]
provider = "gradus"

[paths]
source = "src"

[build]
kind = "lib"
target = "fmir"
targets = ["fmir", "rust"]

[locale]
locale = "en"

# `faber test` under the default `auto` device refuses every @ kernel call.
# The package's proba cases call kernels (math.add, the decode_step and
# kernel rows) and pin their values against the host-form oracle, so the
# package selects the reference route; `--device` still overrides it.
[device]
device = "reference"
