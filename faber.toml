[package]
name = "gradus"
version = "0.1.0"
edition = "2026"

[library]
provider = "gradus"

[paths]
source = "src"

[build]
kind = "lib"
target = "fmir"
targets = ["fmir", "rust"]

[locale]
locale = "en"

# `faber test` under the default `auto` device refuses every @ kernel call.
# The package's proba cases call kernels (math.add, the decode_step and
# kernel rows), so the package selects the CPU device session; `--device`
# still overrides it. Kernel results are judged within the tolerance policy,
# never byte for byte against host values.
[device]
device = "cpu"
